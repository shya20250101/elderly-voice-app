<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高齡者一鍵語音助理 (Elderly Voice Assistant)</title>
    <style>
        :root {
            --bg-color: #F8F9FA;
            --text-color: #212529;
            --primary-green: #28A745;
            --primary-green-active: #1E7E34;
            --primary-blue: #007BFF;
            --danger-red: #DC3545;
            --card-bg: #FFFFFF;
            --line-green: #06C755;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }

        .title { font-size: 26px; font-weight: bold; color: #333; }
        
        .settings-btn {
            background: #E9ECEF;
            border: 2px solid #CED4DA;
            border-radius: 12px;
            padding: 8px 14px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        /* 巨型語音按鈕 */
        .mic-btn-container { margin: 20px 0; display: flex; flex-direction: column; align-items: center; }

        .mic-btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background-color: var(--primary-green);
            color: white;
            border: 8px solid #D4EDDA;
            box-shadow: 0 10px 25px rgba(40, 167, 69, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            user-select: none;
        }

        .mic-btn:active { transform: scale(0.95); background-color: var(--primary-green-active); }
        .mic-btn.listening { background-color: var(--danger-red); border-color: #F8D7DA; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); }
            70% { box-shadow: 0 0 0 25px rgba(220, 53, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }

        .mic-icon { font-size: 60px; margin-bottom: 5px; }
        .mic-label { font-size: 24px; font-weight: bold; }

        /* 狀態顯示卡片 */
        .status-card {
            width: 100%;
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            box-sizing: border-box;
            text-align: center;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid #E9ECEF;
        }

        .status-title { font-size: 18px; color: #6C757D; margin-bottom: 6px; }
        .status-text { font-size: 24px; font-weight: bold; color: #1D2124; line-height: 1.4; }

        /* 互動彈窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        .modal-title { font-size: 26px; font-weight: bold; margin-bottom: 15px; }
        .modal-body { font-size: 20px; line-height: 1.5; color: #333; margin-bottom: 25px; }

        .modal-btn {
            width: 100%;
            padding: 16px;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-green { background-color: var(--line-green); color: white; }
        .btn-gray { background-color: #6C757D; color: white; }

        /* 測試面板 */
        .test-panel {
            width: 100%;
            background: #E9ECEF;
            border-radius: 16px;
            padding: 15px;
            margin-top: 10px;
            box-sizing: border-box;
        }
        .test-panel-title { font-size: 15px; color: #6C757D; font-weight: bold; margin-bottom: 8px; text-align: center; }
        .test-btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .test-btn { background: white; border: 1px solid #CED4DA; border-radius: 8px; padding: 10px; font-size: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="title">一鍵語音助理 (研究原型)</div>
            <button class="settings-btn" onclick="openSettings()">⚙️ 設定選項</button>
        </div>

        <div class="mic-btn-container">
            <div class="mic-btn" id="micBtn" onclick="toggleListening()">
                <div class="mic-icon">🎤</div>
                <div class="mic-label" id="micLabel">按一下說話</div>
            </div>
        </div>

        <div class="status-card">
            <div class="status-title">系統狀態提示</div>
            <div class="status-text" id="statusText">請點擊上方綠色按鈕開始說話</div>
        </div>

        <div class="test-panel">
            <div class="test-panel-title">💡 測試控制台（語音模擬）</div>
            <div class="test-btn-grid">
                <button class="test-btn" onclick="simulateCommand('找釋放')">1. 說：找釋放</button>
                <button class="test-btn" onclick="simulateCommand('未辨釋放')">2. 誤判：未辨釋放</button>
                <button class="test-btn" onclick="simulateCommand('活動中心')">3. 活動中心網頁</button>
                <button class="test-btn" onclick="simulateCommand('打給醫院')">4. 撥打救援電話</button>
            </div>
        </div>
    </div>

    <!-- 互動彈窗 -->
    <div class="modal" id="infoModal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">標題</div>
            <div class="modal-body" id="modalBody">內容說明</div>
            <button class="modal-btn btn-green" id="modalPrimaryBtn" onclick="closeModal()">確定</button>
            <button class="modal-btn btn-gray" style="margin-top: 8px;" onclick="closeModal()">關閉</button>
        </div>
    </div>

    <script>
        let settings = {
            activityCenterUrl: "https://www.tainan.gov.tw/",
            welfareUrl: "https://sfaa.moi.gov.tw/",
            medicalTarget: "119"
        };

        let isListening = false;

        function speak(text, callback) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-TW';
                utterance.rate = 0.9;
                utterance.onend = function() { if (callback) callback(); };
                window.speechSynthesis.speak(utterance);
            } else {
                if (callback) callback();
            }
        }

        function toggleListening() {
            const micBtn = document.getElementById('micBtn');
            const micLabel = document.getElementById('micLabel');
            const statusText = document.getElementById('statusText');

            if (!isListening) {
                isListening = true;
                micBtn.classList.add('listening');
                micLabel.innerText = "聆聽中...";
                statusText.innerText = "正在聽您說話...";
                speak("請說話");

                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    const recognition = new SpeechRecognition();
                    recognition.lang = 'zh-TW';
                    recognition.onresult = function(event) {
                        let spoken = event.results[0][0].transcript;
                        handleSpeechResult(spoken);
                        stopListeningUI();
                    };
                    recognition.onerror = function() {
                        stopListeningUI();
                    };
                    recognition.start();
                } else {
                    setTimeout(() => {
                        stopListeningUI();
                    }, 1200);
                }
            } else {
                stopListeningUI();
            }
        }

        function stopListeningUI() {
            isListening = false;
            document.getElementById('micBtn').classList.remove('listening');
            document.getElementById('micLabel').innerText = "按一下說話";
        }

        function simulateCommand(cmd) {
            document.getElementById('statusText').innerText = `指令：「${cmd}」`;
            handleSpeechResult(cmd);
        }

        function handleSpeechResult(text) {
            const statusText = document.getElementById('statusText');

            if (text.includes("醫院") || text.includes("119") || text.includes("救援") || text.includes("救護車")) {
                statusText.innerText = `正在撥打：${settings.medicalTarget}`;
                speak(`正在撥打 ${settings.medicalTarget}`, () => {
                    window.location.href = `tel:${settings.medicalTarget}`;
                });
                return;
            }

            if (text.includes("活動") || text.includes("中心")) {
                statusText.innerText = "正在開啟活動中心網頁...";
                speak("正在開啟活動中心", () => window.open(settings.activityCenterUrl, '_blank'));
                return;
            }

            if (text.includes("福利") || text.includes("補助")) {
                statusText.innerText = "正在開啟老人福利網...";
                speak("正在開啟福利網", () => window.open(settings.welfareUrl, '_blank'));
                return;
            }

            const keywords = ["找", "幫我", "打給", "LINE", "賴", "未辨", "照", "著", "招"];
            let isContactCmd = keywords.some(kw => text.includes(kw));

            if (isContactCmd || text.length >= 2) {
                let targetName = text;
                keywords.concat(["搜尋", "聯絡", "電話"]).forEach(word => {
                    targetName = targetName.replaceAll(word, "");
                });
                targetName = targetName.trim();

                if (targetName.length > 0) {
                    statusText.innerText = `已鎖定對象：${targetName}`;
                    speak(`已鎖定，請點擊按鈕開啟 LINE 並貼上名字`, () => {
                        showLINEModalWithUniversalLink(targetName);
                    });
                    return;
                }
            }

            statusText.innerText = `未辨識：「${text}」，請再試一次`;
            speak("聽不清楚，請再說一次");
        }

        // 使用 LINE 官方通用連結強制開啟 App，並同步複製人名
        function showLINEModalWithUniversalLink(name) {
            document.getElementById('modalTitle').innerText = `💬 LINE 快速連線`;
            document.getElementById('modalBody').innerHTML = `
                <div style="font-size: 20px; margin-bottom: 8px;">已為您複製對象：</div>
                <div style="color: #06C755; font-size: 30px; font-weight: bold; margin-bottom: 12px;">【 ${name} 】</div>
                <div style="font-size: 15px; color: #555; line-height: 1.4;">
                    點擊下方按鈕將強制開啟 LINE。<br>
                    進入後請在搜尋框<b>長按並貼上</b>即可！
                </div>
            `;
            document.getElementById('modalPrimaryBtn').innerText = `開啟 LINE 找「${name}」`;
            
            document.getElementById('modalPrimaryBtn').onclick = function() {
                // 1. 自動複製名字到手機剪貼簿
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(name);
                }
                // 2. 透過 LINE Universal Link 強制喚起 App
                window.location.href = "https://line.me/R/";
                closeModal();
            };
            
            document.getElementById('infoModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('infoModal').style.display = 'none'; }
        function openSettings() { alert("設定已開啟"); }
    </script>
</body>
</html>
