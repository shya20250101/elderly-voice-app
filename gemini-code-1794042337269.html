<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高齡者一鍵語音助理 (Elderly Voice Assistant)</title>
    <style>
        :root {
            --bg-color: #F8F9FA;
            --text-color: #212529;
            --primary-green: #28A745;
            --primary-green-active: #1E7E34;
            --primary-blue: #007BFF;
            --danger-red: #DC3545;
            --card-bg: #FFFFFF;
            --line-green: #06C755;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }

        .title {
            font-size: 26px;
            font-weight: bold;
            color: #333;
        }

        .settings-btn {
            background: #E9ECEF;
            border: 2px solid #CED4DA;
            border-radius: 12px;
            padding: 8px 14px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        /* 巨型語音按鈕 */
        .mic-btn-container {
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .mic-btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background-color: var(--primary-green);
            color: white;
            border: 8px solid #D4EDDA;
            box-shadow: 0 10px 25px rgba(40, 167, 69, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            user-select: none;
        }

        .mic-btn:active {
            transform: scale(0.95);
            background-color: var(--primary-green-active);
        }

        .mic-btn.listening {
            background-color: var(--danger-red);
            border-color: #F8D7DA;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); }
            70% { box-shadow: 0 0 0 25px rgba(220, 53, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }

        .mic-icon { font-size: 60px; margin-bottom: 5px; }
        .mic-label { font-size: 24px; font-weight: bold; }

        /* 狀態顯示卡片 */
        .status-card {
            width: 100%;
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            box-sizing: border-box;
            text-align: center;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid #E9ECEF;
        }

        .status-title { font-size: 18px; color: #6C757D; margin-bottom: 6px; }
        .status-text { font-size: 24px; font-weight: bold; color: #1D2124; line-height: 1.4; }

        /* 互動彈窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        .modal-title { font-size: 26px; font-weight: bold; margin-bottom: 15px; }
        .modal-body { font-size: 20px; line-height: 1.5; color: #333; margin-bottom: 25px; }

        .modal-btn {
            width: 100%;
            padding: 16px;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-green { background-color: var(--line-green); color: white; }
        .btn-blue { background-color: var(--primary-blue); color: white; }
        .btn-red { background-color: var(--danger-red); color: white; }
        .btn-gray { background-color: #6C757D; color: white; }

        /* 通話與防呆畫面 */
        .call-card {
            display: none;
            width: 100%;
            background: #111;
            color: white;
            border-radius: 24px;
            padding: 30px 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .call-timer { font-size: 36px; font-weight: bold; color: #28A745; margin: 10px 0; }
        .failsafe-box {
            background: rgba(220, 53, 69, 0.2);
            border: 2px solid var(--danger-red);
            border-radius: 16px;
            padding: 15px;
            margin-top: 15px;
        }
        .failsafe-title { font-size: 18px; color: #FFC107; font-weight: bold; }
        .failsafe-countdown { font-size: 28px; color: var(--danger-red); font-weight: bold; }

        /* 測試面板 */
        .test-panel {
            width: 100%;
            background: #E9ECEF;
            border-radius: 16px;
            padding: 15px;
            margin-top: 10px;
            box-sizing: border-box;
        }
        .test-panel-title { font-size: 15px; color: #6C757D; font-weight: bold; margin-bottom: 8px; text-align: center; }
        .test-btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .test-btn { background: white; border: 1px solid #CED4DA; border-radius: 8px; padding: 10px; font-size: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="title">一鍵語音助理 (研究原型)</div>
            <button class="settings-btn" onclick="openSettings()">⚙️ 設定選項</button>
        </div>

        <div class="mic-btn-container">
            <div class="mic-btn" id="micBtn" onclick="toggleListening()">
                <div class="mic-icon">🎤</div>
                <div class="mic-label" id="micLabel">按一下說話</div>
            </div>
        </div>

        <div class="status-card">
            <div class="status-title">系統狀態提示</div>
            <div class="status-text" id="statusText">請點擊上方綠色按鈕開始說話</div>
        </div>

        <!-- 通話與 15 秒防呆倒數視窗 -->
        <div class="call-card" id="callCard">
            <div style="font-size: 22px; color: #AAA;">正在通話中</div>
            <div style="font-size: 32px; font-weight: bold; margin-top: 8px;" id="callTargetName">119 緊急救援</div>
            <div class="call-timer" id="callDuration">00:05</div>

            <div class="failsafe-box">
                <div class="failsafe-title">🛡️ 15秒無對話自動掛斷監測 (Fail-Safe)</div>
                <div style="font-size: 15px; color: #EEE; margin: 4px 0;">持續靜音將自動切斷保護：</div>
                <div class="failsafe-countdown" id="failsafeTimer">15 秒</div>
            </div>

            <button class="modal-btn btn-red" style="margin-top: 15px;" onclick="endCall('手動掛斷')">🔴 結束通話</button>
        </div>

        <!-- 模擬測試面板 -->
        <div class="test-panel">
            <div class="test-panel-title">💡 測試控制台（無麥克風時點擊模擬）</div>
            <div class="test-btn-grid">
                <button class="test-btn" onclick="simulateCommand('找王伯伯')">1. LINE 好友</button>
                <button class="test-btn" onclick="simulateCommand('活動中心')">2. 中榮里活動中心</button>
                <button class="test-btn" onclick="simulateCommand('福利消息')">3. 老人福利網</button>
                <button class="test-btn" onclick="simulateCommand('打給醫院')">4. 醫療/119通話</button>
                <button class="test-btn" onclick="simulateCommand('防呆測試')" style="grid-column: span 2; background: #FFF3CD;">5. 觸發 15 秒自動掛斷</button>
            </div>
        </div>
    </div>

    <!-- 彈出互動視窗 -->
    <div class="modal" id="infoModal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">標題</div>
            <div class="modal-body" id="modalBody">內容說明</div>
            <button class="modal-btn btn-green" id="modalPrimaryBtn" onclick="closeModal()">確定</button>
            <button class="modal-btn btn-gray" style="margin-top: 8px;" onclick="closeModal()">關閉</button>
        </div>
    </div>

    <script>
        let settings = {
            friends: ["王伯伯", "陳阿姨", "大兒子"],
            activityCenterUrl: "https://www.tainan.gov.tw/",
            welfareUrl: "https://sfaa.moi.gov.tw/",
            medicalTarget: "119"
        };

        let isListening = false;
        let failsafeInterval = null;
        let callInterval = null;

        function speak(text, callback) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-TW';
                utterance.rate = 0.9;
                utterance.onend = function() { if (callback) callback(); };
                window.speechSynthesis.speak(utterance);
            } else {
                if (callback) callback();
            }
        }

        function toggleListening() {
            const micBtn = document.getElementById('micBtn');
            const micLabel = document.getElementById('micLabel');
            const statusText = document.getElementById('statusText');

            if (!isListening) {
                isListening = true;
                micBtn.classList.add('listening');
                micLabel.innerText = "聆聽中...";
                statusText.innerText = "正在聽您說話...";
                speak("請說話");

                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    const recognition = new SpeechRecognition();
                    recognition.lang = 'zh-TW';
                    recognition.onresult = function(event) {
                        handleSpeechResult(event.results[0][0].transcript);
                        stopListeningUI();
                    };
                    recognition.onerror = function() {
                        showSimulationMenu();
                        stopListeningUI();
                    };
                    recognition.start();
                } else {
                    setTimeout(() => {
                        showSimulationMenu();
                        stopListeningUI();
                    }, 1200);
                }
            } else {
                stopListeningUI();
            }
        }

        function stopListeningUI() {
            isListening = false;
            document.getElementById('micBtn').classList.remove('listening');
            document.getElementById('micLabel').innerText = "按一下說話";
        }

        function showSimulationMenu() {
            document.getElementById('modalTitle').innerText = "請選擇長輩要執行的操作";
            document.getElementById('modalBody').innerHTML = `
                <div style="font-size: 18px; text-align: left; line-height: 1.6;">
                    • <strong>LINE：</strong> 找王伯伯<br>
                    • <strong>活動中心：</strong> 中榮里活動中心網頁<br>
                    • <strong>福利站：</strong> 政府老人福利網<br>
                    • <strong>醫療院所：</strong> 撥打 119 或自訂醫院
                </div>
            `;
            document.getElementById('modalPrimaryBtn').innerText = "測試：開啟活動中心網頁";
            document.getElementById('modalPrimaryBtn').onclick = function() {
                closeModal();
                simulateCommand("活動中心");
            };
            document.getElementById('infoModal').style.display = 'flex';
        }

        function simulateCommand(cmd) {
            document.getElementById('statusText').innerText = `指令：「${cmd}」`;
            handleSpeechResult(cmd);
        }

        function handleSpeechResult(text) {
            const statusText = document.getElementById('statusText');

            let matched = settings.friends.find(f => text.includes(f));
            if (matched || text.includes("找") || text.includes("LINE")) {
                let target = matched || settings.friends[0];
                statusText.innerText = `正在連線 LINE：${target}`;
                speak(`正在為您連線 ${target}`, () => showLINEWindow(target));
                return;
            }

            if (text.includes("活動") || text.includes("中心") || text.includes("中榮里")) {
                statusText.innerText = "正在開啟中榮里活動中心網頁...";
                speak("正在為您開啟活動中心網頁", () => {
                    window.open(settings.activityCenterUrl, '_blank');
                });
                return;
            }

            if (text.includes("福利") || text.includes("補助") || text.includes("老人")) {
                statusText.innerText = "正在開啟政府老人福利網站...";
                speak("正在為您開啟政府老人福利網", () => {
                    window.open(settings.welfareUrl, '_blank');
                });
                return;
            }

            if (text.includes("醫院") || text.includes("掛號") || text.includes("打給") || text.includes("119") || text.includes("救命")) {
                statusText.innerText = `正在撥打醫療/救援專線：${settings.medicalTarget}`;
                speak(`正在為您撥打 ${settings.medicalTarget}，請稍後`, () => {
                    startCallSession(settings.medicalTarget);
                });
                return;
            }

            if (text.includes("防呆") || text.includes("測試")) {
                startCallSession("測試通話（15秒防呆）");
                return;
            }

            statusText.innerText = `未辨識：「${text}」`;
            speak("請再說一次。");
        }

        function showLINEWindow(name) {
            document.getElementById('modalTitle').innerText = `💬 LINE：${name}`;
            document.getElementById('modalBody').innerHTML = `<div style="font-size: 20px;">已準備好與 <b>${name}</b> 的語音通話與對話。</div>`;
            document.getElementById('modalPrimaryBtn').innerText = "開啟手機 LINE App";
            document.getElementById('modalPrimaryBtn').onclick = () => { window.location.href = "line://"; closeModal(); };
            document.getElementById('infoModal').style.display = 'flex';
        }

        function startCallSession(target) {
            document.getElementById('callCard').style.display = 'block';
            document.getElementById('callTargetName').innerText = target;

            if (target === "119" || target.length > 3) {
                setTimeout(() => { window.location.href = `tel:${target}`; }, 1000);
            }

            let seconds = 0, failsafe = 15;
            clearInterval(callInterval); clearInterval(failsafeInterval);

            callInterval = setInterval(() => {
                seconds++;
                let m = String(Math.floor(seconds / 60)).padStart(2, '0');
                let s = String(seconds % 60).padStart(2, '0');
                document.getElementById('callDuration').innerText = `${m}:${s}`;
            }, 1000);

            document.getElementById('failsafeTimer').innerText = `${failsafe} 秒`;
            failsafeInterval = setInterval(() => {
                failsafe--;
                document.getElementById('failsafeTimer').innerText = `${failsafe} 秒`;
                if (failsafe <= 3 && failsafe > 0) speak("偵測到無對話，即將自動掛斷");
                if (failsafe <= 0) {
                    clearInterval(failsafeInterval); clearInterval(callInterval);
                    speak("15秒無對話，系統已自動掛斷通話");
                    endCall("15秒自動防呆掛斷");
                }
            }, 1000);
        }

        function endCall(reason) {
            clearInterval(callInterval); clearInterval(failsafeInterval);
            document.getElementById('callCard').style.display = 'none';
            document.getElementById('statusText').innerText = `通話結束（${reason}）`;
        }

        function closeModal() { document.getElementById('infoModal').style.display = 'none'; }

        function openSettings() {
            let centerInput = prompt("請輸入活動中心網址：", settings.activityCenterUrl);
            if (centerInput) settings.activityCenterUrl = centerInput;

            let welfareInput = prompt("請輸入政府老人福利網網址：", settings.welfareUrl);
            if (welfareInput) settings.welfareUrl = welfareInput;

            let medInput = prompt("請輸入醫療院所電話或緊急號碼 (預設 119)：", settings.medicalTarget);
            if (medInput) settings.medicalTarget = medInput;

            alert("設定已更新成功！");
        }
    </script>
</body>
</html>
